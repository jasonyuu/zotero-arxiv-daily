name: Send emails daily
on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'

jobs:
  calculate-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.REPOSITORY }}
          ref: ${{ vars.REF }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Test IEEE API
        env:
          IEEE_API_KEY: ${{ secrets.IEEE_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import requests

          API_KEY = os.environ["IEEE_API_KEY"]

          url = "https://ieeexploreapi.ieee.org/api/v1/search/articles"

          tests = [
              {
                  "name": "TEST 1 - Minimal",
                  "params": {
                      "apikey": API_KEY,
                      "querytext": "motor",
                      "max_records": 1,
                  },
              },
              {
                  "name": "TEST 2 - Five Years",
                  "params": {
                      "apikey": API_KEY,
                      "querytext": "permanent magnet synchronous motor",
                      "start_year": 2022,
                      "end_year": 2026,
                      "max_records": 10,
                      "start_record": 1,
                  },
              },
              {
                  "name": "TEST 3 - Explicit JSON",
                  "params": {
                      "apikey": API_KEY,
                      "querytext": "motor",
                      "max_records": 1,
                      "format": "json",
                  },
              },
          ]

          headers_list = [
              {
                  "Accept": "application/json",
                  "User-Agent": "Mozilla/5.0",
              },
              {
                  "Accept": "application/json",
                  "User-Agent": "zotero-arxiv-daily/1.0",
              },
          ]

          for test in tests:

              print()
              print("========================================")
              print(test["name"])
              print("========================================")

              for i, headers in enumerate(headers_list, 1):

                  try:

                      r = requests.get(
                          url,
                          params=test["params"],
                          headers=headers,
                          timeout=30,
                      )

                      print(
                          f"Header test {i}: "
                          f"HTTP {r.status_code}"
                      )

                      print(
                          "Content-Type:",
                          r.headers.get("Content-Type")
                      )

                      safe_url = r.url.replace(
                          API_KEY,
                          "***"
                      )

                      print(
                          "URL:",
                          safe_url
                      )

                      print(
                          "Response:",
                          r.text[:500]
                      )

                  except Exception as e:

                      print(
                          "ERROR:",
                          repr(e)
                      )

                  print("----------------------------------------")

          PY

      - name: Run script
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
          IEEE_API_KEY: ${{ secrets.IEEE_API_KEY }}
        run: |
          printf "%b\n" "$CUSTOM_CONFIG" > config/custom.yaml
          echo "Use custom config: "
          cat config/custom.yaml
          uv run src/zotero_arxiv_daily/main.py